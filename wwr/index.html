<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Discover exciting white water rafting adventures, explore nature, and find your next outdoor adventure with us.">
    <meta name="author" content="Reagan Adjartey">
    <title>Home Page | White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/profile.png" alt="White Water Rafting Logo">


        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <section class="hero">
            <img src="images/hero_image_2.jpg"
              alt="Adventurers enjoying a white water rafting trip">

            <h1>Have an Adventure</h1>
        </section>

        <section class="home-cta">
            <h2>Your Next Adventure Starts Here!</h2>
            <a href="trips.html" class="cta-button">Explore Our Trips</a>
        </section>

        <section class="home-grid">

            <div class="home-card">
                <img src="images/forest_river.jpg" alt="Beautiful forest surrounding a river">
                <h2>Forest</h2>
            </div>

            <div class="home-card">
                <img src="images/rafting_rapids.jpg"
                  alt="White water rafting through exciting river rapids">
                <h2>Rapids</h2>

            </div>

        </section>

        <section class="newsletter">
            <h2>Join Our Newsletter</h2>

            <p>
                Stay informed about our rafting adventures, upcoming trips,
                and exciting outdoor experiences.
            </p>

            <form action="#" method="get">
                <div class="newsletter-field">
                    <label for="newsletter-name">Your Name:</label>
                    <input type="text" id="newsletter-name" name="name" required>
                </div>

                <div class="newsletter-field">
                    <label for="newsletter-email">Your Email:</label>
                    <input type="email" id="newsletter-email" name="email" required>
                </div>

                <button type="submit">Subscribe</button>
            </form>
        </section>

    </main>

    <footer>
        <p>©2026 White Water Rafting | Reagan Adjartey</p>

        <nav class="socialmedia">
            <a href="https://twitter.com">
                <img src="images/twitter.svg" alt="Twitter Icon">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>

            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
        </nav>
    </footer>


</body>

</html>
